name: build-package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:base-devel
    timeout-minutes: 300
    env:
      LC_ALL: zh_CN.UTF_8
    steps:
      - name: Generate locale
        run: locale-gen

      - name: Test date and directory
        run: date && ls -la .
